<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/home-hands.css' | relative_url }}">
  <script>
    (function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();
  </script>
  <script src="{{ '/assets/js/home-hands.js' | relative_url }}" defer></script>
</head>
<body class="hands-home">
<a class="skip-link" href="#articles">跳到文章</a>
<header class="hands-masthead">
  <a class="hands-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="hands-nav" aria-label="主导航"><a href="#articles">文章</a><button class="theme-toggle" aria-label="切换深浅色模式"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.5A6.7 6.7 0 0 1 7.5 4a6.7 6.7 0 1 0 8.5 8.5Z"/></svg></button></nav>
</header>
<main id="main">
  <section class="hands-hero" aria-labelledby="hero-title">
    <div class="hands-art">{% include home-hands.html %}</div>
    <div class="hands-copy"><h1 id="hero-title"><a href="#articles">让想法相遇</a></h1></div>
  </section>
  <section id="articles" class="writing" aria-labelledby="writing-title">
    <h2 class="writing-heading" id="writing-title">文章</h2>
    {% for post in site.posts %}
    <article class="writing-entry">
      <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%Y.%m.%d' }}</time>
      <h2><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      <a href="{{ post.url | relative_url }}" aria-label="阅读：{{ post.title | escape }}">↗</a>
    </article>
    {% else %}
    <p class="writing-empty">新的手记正在整理中。</p>
    {% endfor %}
  </section>
</main>
<footer class="hands-footer">
  <span class="copyright">© {{ site.title }}</span>
  <a href="https://github.com/hubooooooo/ai-pm-articles">GitHub</a>
  <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
</footer>
</body>
</html>
