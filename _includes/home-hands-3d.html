<div class="hands-3d-stage" aria-hidden="true">
  <picture class="hands-3d-poster poster-light"><source media="(max-width:700px)" srcset="{{ '/assets/images/hands-3d-mobile-light.png' | relative_url }}?v={{ site.time | date: '%s' }}"><img src="{{ '/assets/images/hands-3d-desktop-light.png' | relative_url }}?v={{ site.time | date: '%s' }}" alt="" fetchpriority="high"></picture>
  <picture class="hands-3d-poster poster-dark"><source media="(max-width:700px)" srcset="{{ '/assets/images/hands-3d-mobile-dark.png' | relative_url }}?v={{ site.time | date: '%s' }}"><img src="{{ '/assets/images/hands-3d-desktop-dark.png' | relative_url }}?v={{ site.time | date: '%s' }}" alt=""></picture>
  <span class="contact-signal" aria-hidden="true"></span>
  <canvas></canvas>
</div>
